[workspace]
members = [
    "crates/lawn_core",
    "crates/lawn_render",
    "crates/lawn_orbit",
    "crates/lawn_tools",
    "crates/lawn_web_dev",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0.100"
bytemuck = { version = "1.25.0", features = ["derive"] }
directories = "6.0.0"
egui = "0.35.0"
egui-wgpu = { version = "0.35.0", features = ["winit"] }
egui-winit = { version = "0.35.0", default-features = false }
gilrs = { version = "0.11.2", features = ["serde-serialize"] }
glam = { version = "0.30.9", features = ["bytemuck", "serde"] }
pollster = "0.4.0"
rand = { version = "0.9.2", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9.0", features = ["serde"] }
rapier3d = { version = "0.35.3", features = ["serde-serialize"] }
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
web-time = "1.1.0"
wgpu = "29.0.1"
winit = "0.30.13"
bincode = "1.3.3"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
js-sys = "0.3.104"
web-sys = "0.3.104"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Grid, packed-channel, and GPU-facing code deliberately converts between the
# bounded integer/float domains documented at each data structure boundary.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
# State/config snapshots naturally expose several independent switches, and
# deterministic regression tests intentionally use exact floating comparisons.
struct_excessive_bools = "allow"
too_many_arguments = "allow"
float_cmp = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
